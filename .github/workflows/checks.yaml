name: Checks
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  configs_check:
    name: Validate configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        uses: bahmutov/npm-install@v1
        with:
          useRollingCache: true

      - name: Run ESLint
        run: yarn eslint .

      - name: Validate marketplace config schema
        run: yarn validate:marketplace

      - name: Validate marketplace security reports schema
        run: yarn validate:marketplace-security-reports

      - name: Validate featured networks config schema
        run: yarn validate:featured-networks

      - name: Validate footer links config schema
        run: yarn validate:footer-links

      - name: Validate DOS Chain token list
        shell: bash
        run: |
          set -euo pipefail
          schema_url="https://raw.githubusercontent.com/Uniswap/token-lists/01705f94a307270b6c0fe5f55c7e66f7b92373cc/src/tokenlist.schema.json"
          curl --fail --silent --show-error --location "${schema_url}" --output "${RUNNER_TEMP}/tokenlist.schema.json"
          npx --yes ajv-cli@5.0.0 validate \
            --strict=false \
            -s "${RUNNER_TEMP}/tokenlist.schema.json" \
            -d configs/token-lists/mainnet.json
          jq -e '
            (.tokens | length > 0) and
            (([.tokens[].address | ascii_downcase] | unique | length) == (.tokens | length)) and
            ([.tokens[] |
              (.chainId == 7979) and
              ((.address | ascii_downcase) != "0x0000000000000000000000000000000000000000") and
              (.logoURI | test("^https://raw\\.githubusercontent\\.com/DOS/DOScan-Frontend-Configs/main/configs/token-icons/[A-Za-z0-9._-]+\\.(svg|png)$"))
            ] | all)
          ' configs/token-lists/mainnet.json >/dev/null
          python3 -m unittest discover -s tools/token-list-validator -p "test_*.py"
          python3 tools/token-list-validator/validate_assets.py configs/token-lists/mainnet.json
